name: API tests

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * *'   # daily run catches API regressions even without code changes
  workflow_dispatch:

jobs:
  karate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run Karate suite
        run: mvn -B test
      - name: Upload Karate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karate-report
          path: target/karate-reports
